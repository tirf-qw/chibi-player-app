<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chibi Floating Player</title>
<style>
:root{--panel:#121212;--card:#181818;--card2:#282828;--line:#2a2a2a;--text:#fff;--muted:#b3b3b3;--green:#1ed760;--size:124px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html.app,html.app body{background:transparent!important}
.app .hint{display:none}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--text);overflow:hidden;
  background:radial-gradient(1200px 700px at 30% 20%,#1c1c24 0,#0b0b0d 60%)}
.hint{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#3b3b44;font-size:15px;line-height:1.7;pointer-events:none}
button{font:inherit;color:inherit}

/* floating head */
#wid{position:fixed;left:0;top:0;width:var(--size);height:var(--size);z-index:50;will-change:transform}
#wid::after{content:"";position:absolute;inset:-18px;border-radius:50%}
#head{position:absolute;inset:0;display:grid;place-items:center;cursor:grab;touch-action:none;z-index:2}
#wid.dragging #head{cursor:grabbing}
#headImg{width:118px;height:118px;object-fit:contain;pointer-events:none;user-select:none;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.6));animation:spin 6s linear infinite;animation-play-state:paused;transition:width .3s,height .3s}
#wid.playing #headImg{animation-play-state:running}
#wid.open #headImg{width:126px;height:126px}
@keyframes spin{to{transform:rotate(360deg)}}

/* panel */
#panel{position:absolute;top:0;width:min(420px,calc(100vw - 24px));height:min(600px,calc(100vh - 16px));display:flex;flex-direction:column;
  background:#000;border:1px solid #242424;border-radius:16px;box-shadow:0 28px 70px rgba(0,0,0,.75);z-index:1;overflow:hidden;
  opacity:0;transform:scale(.35);pointer-events:none;visibility:hidden;transition:opacity .28s,transform .4s cubic-bezier(.2,.9,.25,1.12),visibility 0s linear .4s}
#wid.open #panel{opacity:1;transform:scale(1);pointer-events:auto;visibility:visible;transition-delay:0s,0s,0s}
#body{flex:1;overflow:auto;padding:14px 12px 8px;background:linear-gradient(#1f3a2c 0,#121212 240px) no-repeat,#121212;margin:0;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
.gr{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:2px 0 14px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}
.chip{flex:none;background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff}
.chip:hover{background:rgba(255,255,255,.18)}
.chip.on{background:var(--green);color:#000}
.h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.pill{background:var(--green);color:#000;border:0;border-radius:99px;padding:7px 15px;font-size:12px;font-weight:700;cursor:pointer;transition:transform .12s}
.pill:hover{transform:scale(1.04)}
.pill.g{background:rgba(255,255,255,.12);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:6px;border-radius:6px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.08)}
.row.cur .m b{color:var(--green)}
.th{width:48px;height:48px;border-radius:4px;flex:none;background:#2c2c32 center/cover;display:grid;place-items:center;font-size:18px}
.m{min-width:0;flex:1}
.m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sec{margin-bottom:18px}
.sec .h{margin-top:0}
.shelf{display:flex;gap:6px;overflow-x:auto;margin:0 -12px;padding:0 8px 4px;scrollbar-width:none}
.tc{flex:none;width:130px;background:none;border:0;text-align:left;cursor:pointer;padding:8px;border-radius:8px;transition:background .15s}
.tc:hover{background:var(--card2)}
.tc .cv{width:114px;height:114px;border-radius:6px;background:#2c2c32 center/cover;box-shadow:0 8px 18px rgba(0,0,0,.45);display:grid;place-items:center;font-size:30px}
.tc b{display:block;font-size:13px;font-weight:700;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.art .cv{border-radius:50%}
.ph{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
.ph .cv{width:96px;height:96px;border-radius:8px;background:#2c2c32 center/cover;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ph .cv.rd{border-radius:50%}
.ph b{display:block;font-size:20px;font-weight:800;line-height:1.15}
.ph span{display:block;font-size:12px;color:var(--muted);margin:4px 0 10px}
.grid .tc{width:auto;background:var(--card)}
.grid .tc:hover{background:var(--card2)}
.grid .tc .cv{width:100%;height:auto;aspect-ratio:1}
.qt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.qb{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:0;border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;height:54px;padding:0 8px 0 0;transition:background .15s}
.qb:hover{background:rgba(255,255,255,.17)}
.qb .cv{width:54px;height:54px;flex:none;background:#333 center/cover;display:grid;place-items:center;font-size:20px}
.qb b{font-size:12.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt{border:0;border-radius:8px;height:84px;padding:12px;text-align:left;font-weight:800;font-size:15px;color:#fff;cursor:pointer;line-height:1.15;transition:transform .12s}
.bt:hover{transform:scale(1.03)}
.empty{color:var(--muted);font-size:13px;padding:22px 6px;text-align:center;line-height:1.6}
.note{background:#2a2113;border:1px solid #4a3a18;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.5;color:#e8d9bb}
.note b{color:#ffd479}
input[type=text]{width:100%;background:#2a2a2a;border:1px solid transparent;border-radius:8px;padding:11px 14px;color:var(--text);font:inherit;font-size:14px;margin-bottom:12px}
input[type=text]:focus{outline:2px solid #fff;outline-offset:0}
#q{background:#fff;color:#000;font-weight:600}
#q::placeholder{color:#6a6a6a;font-weight:500}
#q:focus{outline:3px solid var(--green)}
.set label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:16px 0 8px}
.set p{color:var(--muted);font-size:12px;line-height:1.55;margin:14px 0 0}
.set .rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* now playing bar */
#foot{margin:0 8px 4px;background:#282828;border-radius:10px;padding:8px 12px 8px}
.np{display:flex;align-items:center;gap:10px}
#cover{width:46px;height:46px;border-radius:5px;flex:none;background:#3a3a3a center/cover;position:relative;overflow:hidden}
#cover img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
#title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;outline:none;cursor:pointer;background:linear-gradient(to right,#fff var(--p,0%),#5a5a5a var(--p,0%))}
input[type=range]:hover{background:linear-gradient(to right,var(--green) var(--p,0%),#5a5a5a var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:2px}
.ib{background:none;border:0;padding:6px;border-radius:50%;color:var(--muted);cursor:pointer;display:grid;place-items:center;position:relative;transition:color .15s,transform .15s}
.ib:hover{color:#fff;transform:scale(1.1)}
.ib.on{color:var(--green)}
.hb:not(.on) svg,#heart:not(.on) svg{fill:none!important;stroke:currentColor;stroke-width:2}
.tc{position:relative}
.tc .hb{position:absolute;right:14px;top:86px;width:32px;height:32px;padding:0;background:rgba(0,0,0,.6);color:#fff;opacity:0;transition:opacity .15s}
.tc:hover .hb,.tc .hb.on,.tc:focus-within .hb{opacity:1}
.ib svg{width:20px;height:20px;fill:currentColor}
#play{width:40px;height:40px;background:#fff;color:#000}
#play:hover{background:#fff;color:#000;transform:scale(1.07)}
#rep.one::after{content:"1";position:absolute;font-size:9px;font-weight:800;top:11px;left:50%;transform:translateX(-50%)}

/* bottom navigation */
#tabs{display:flex;padding:4px 4px 8px;background:#000}
#tabs button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0}
#tabs button svg{width:22px;height:22px;fill:currentColor}
#tabs button:hover{color:#fff}
#tabs button.on{color:#fff}
#tabs button.on svg{fill:var(--green)}
.ib:focus-visible,.pill:focus-visible,.chip:focus-visible,.tc:focus-visible,.qb:focus-visible,#tabs button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#toast{position:absolute;left:50%;bottom:148px;transform:translateX(-50%);background:#fff;color:#000;font-weight:600;border-radius:8px;padding:8px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:3}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#headImg{animation-duration:14s}}
</style>
</head>
<body>
<div class="hint">Нажми на голову, чтобы включить музыку.<br>Наведи курсор — откроется плеер. Голову можно перетаскивать мышкой.</div>

<div id="wid">
  <div id="head" title="Клик: играть / пауза"><img id="headImg" alt="Chibi"></div>
  <div id="panel" role="region" aria-label="Мини-плеер">
    <div id="body"></div>
    <div id="toast"></div>
    <div id="foot">
      <div class="np">
        <div id="cover"><img id="coverChibi" alt=""></div>
        <div style="min-width:0;flex:1"><div id="title">Ничего не играет</div><div id="artist">Выбери трек или нажми ▶</div></div>
        <button class="ib" id="heart" aria-label="В избранное"></button>
      </div>
      <div class="bar"><span id="tcur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="tdur">0:00</span></div>
      <div class="ctrl">
        <button class="ib" id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4.6 4.6-1.4-1.4 4.6-4.6zM3 5h4.6l9 9.5L19.5 18 21 16.5V21h-4.5l1.5-1.5-2.4-2.5-9-9.5H3zM3 18h4l2.2-2.3 1.4 1.4L8.4 20H3z"/></svg></button>
        <button class="ib" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ib" id="play" aria-label="Играть / пауза"></button>
        <button class="ib" id="next" aria-label="Дальше"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
        <button class="ib" id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      </div>
    </div>
    <nav id="tabs">
      <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.2V21h6.5v-6.5h5V21H21V10.2z"/></svg>Главная</button>
      <button data-t="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>Поиск</button>
      <button data-t="lib"><svg viewBox="0 0 24 24"><path d="M3 3h2.5v18H3zm5 0h2.5v18H8zm5.4.6 2.4-.6 4.6 17.4-2.4.6z"/></svg>Медиатека</button>
      <button data-t="set"><svg viewBox="0 0 24 24"><path d="M4 6h9v2H4zm11 0h5v2h-5zM4 16h5v2H4zm7 0h9v2h-9zM13 4h2v6h-2zM9 14h2v6H9z"/></svg>Настройки</button>
    </nav>
  </div>
</div>
<input type="file" id="hf" accept="image/*" hidden>

<script>
const DEFAULT_HEAD='__HEAD__';
const APP=!!window.__TAURI_INTERNALS__;                       // запущено как приложение (Tauri)
if(APP)document.documentElement.classList.add('app');
const inv=(c,a)=>window.__TAURI_INTERNALS__.invoke(c,a);
const FALLBACK_HEAD='data:image/svg+xml;utf8,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><circle cx='60' cy='62' r='44' fill='#ffd9b8'/><path d='M14 62a46 46 0 0 1 92 0' fill='none' stroke='#1ed760' stroke-width='9'/><rect x='6' y='56' width='16' height='30' rx='8' fill='#1ed760'/><rect x='98' y='56' width='16' height='30' rx='8' fill='#1ed760'/><circle cx='45' cy='64' r='5' fill='#222'/><circle cx='75' cy='64' r='5' fill='#222'/><path d='M48 82q12 10 24 0' fill='none' stroke='#222' stroke-width='4' stroke-linecap='round'/></svg>");
const DEF_HEAD=DEFAULT_HEAD.indexOf('__HEAD__')===0?FALLBACK_HEAD:DEFAULT_HEAD;
const $=s=>document.querySelector(s), SIZE=124;
const HEART='<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const fmt=ms=>{const s=Math.max(0,ms/1000|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=u=>String(u||'').replace(/['"()\\]/g,c=>'%'+c.charCodeAt(0).toString(16));
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};

/* ---------- head image ---------- */
function setHead(s){$('#headImg').src=s;$('#coverChibi').src=s}
setHead(localStorage.getItem('chibi_head')||DEF_HEAD);


const enc=encodeURIComponent;
function pcard(img,title,sub,onclick){
  const b=document.createElement('button');b.className='tc';
  b.innerHTML=`<div class="cv" style="background-image:url('${url(img)}')"></div><b>${esc(title)}</b><span>${esc(sub||'')}</span>`;
  b.onclick=onclick;return b;
}
function pgrid(items,card){const g=document.createElement('div');g.className='grid';items.forEach(it=>g.appendChild(card(it)));return g}

/* ---------- Spotify (Web Playback SDK, нужен Premium) ---------- */
const SP_SCOPES='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-library-read user-library-modify user-read-recently-played user-top-read playlist-read-private playlist-read-collaborative user-follow-read';
const spCid=()=>String(jget('sp_cid','')||'').trim();
const spRedirect=()=>APP?'http://127.0.0.1:8888/callback':location.origin+location.pathname;
const spTok=()=>jget('sp_tok',null);
let ctxMode=false,spPlayer=null,spDev='',spReady=null,spSt=null,spCurId='',spHeard=false;
const rndHex=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(b=>('0'+b.toString(16)).slice(-2)).join('')};
async function sha256b64(t){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const spProblem=()=>APP?'':location.protocol==='file:'?'Плеер открыт как файл, Spotify так не работает. Запусти в папке с файлом: python -m http.server 8888 --bind 127.0.0.1 и открой http://127.0.0.1:8888/'+(location.pathname.split('/').pop()||'player.html')
  :location.hostname==='localhost'?'Открой плеер по адресу 127.0.0.1 вместо localhost: Spotify не принимает localhost.':'';
async function spLogin(){
  if(!spCid()){toast('Сначала вставь Client ID');return}
  const bad=spProblem();if(bad){toast('Нужен адрес 127.0.0.1 — см. подсказку ниже');return}
  const v=rndHex(48);jset('sp_ver',v);
  const au_='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:spCid(),response_type:'code',redirect_uri:spRedirect(),
    scope:SP_SCOPES,code_challenge_method:'S256',code_challenge:await sha256b64(v)});
  if(APP){try{await inv('open_url',{url:au_});toast('Открыл браузер — войди в Spotify и вернись сюда')}catch(e){toast('Не удалось открыть браузер')}}
  else location.href=au_;
}
async function spToken(extra){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:spCid(),...extra})});
  if(!r.ok)throw new Error('token '+r.status);
  const d=await r.json(),old=spTok()||{};
  jset('sp_tok',{a:d.access_token,r:d.refresh_token||old.r,e:Date.now()+d.expires_in*1000-60000});
}
async function spAccess(){
  let t=spTok();if(!t)throw new Error('no auth');
  if(Date.now()>t.e){
    try{await spToken({grant_type:'refresh_token',refresh_token:t.r})}catch(e){localStorage.removeItem('sp_tok');throw e}
    t=spTok();
  }
  return t.a;
}
async function spApi(path,opt={}){
  const a=await spAccess();
  const r=await fetch('https://api.spotify.com/v1'+path,{method:opt.method||'GET',
    headers:Object.assign({Authorization:'Bearer '+a},opt.body?{'Content-Type':'application/json'}:{}),body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===204||r.status===202)return null;
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;try{const j=JSON.parse(await r.text());e.detail=(j.error&&(j.error.message||j.error))||''}catch(_){}throw e}
  const txt=await r.text();return txt?JSON.parse(txt):null;
}
function spInit(){
  if(spReady)return spReady;
  spReady=new Promise((res,rej)=>{
    window.onSpotifyWebPlaybackSDKReady=()=>{
      spPlayer=new Spotify.Player({name:'Chibi Floating Player',getOAuthToken:cb=>{spAccess().then(cb).catch(()=>{})},volume:jget('vol',.8)});
      spPlayer.addListener('ready',({device_id})=>{spDev=device_id;res(device_id)});
      spPlayer.addListener('not_ready',()=>{spDev=''});
      spPlayer.addListener('initialization_error',e=>rej(new Error('init: '+e.message)));
      spPlayer.addListener('authentication_error',()=>rej(new Error('auth')));
      spPlayer.addListener('account_error',()=>{toast('Для Spotify нужен Premium');rej(new Error('account'))});
      spPlayer.addListener('playback_error',()=>toast('Spotify: ошибка воспроизведения'));
      spPlayer.addListener('player_state_changed',spState);
      spPlayer.connect();
    };
    const sc=document.createElement('script');sc.src='https://sdk.scdn.co/spotify-player.js';sc.onerror=()=>rej(new Error('sdk'));document.head.appendChild(sc);
    setTimeout(()=>rej(new Error('timeout')),20000);
  });
  spReady.catch(()=>{spReady=null});
  return spReady;
}
function spState(s){
  if(!s){spSt=null;return}
  const cur=s.track_window&&s.track_window.current_track;
  spSt={pos:s.position,dur:s.duration,paused:s.paused,at:performance.now(),id:cur&&cur.id};
  if(ctxMode&&cur&&cur.id){            // играет подборка/исполнитель целиком: плашку берём из данных Spotify
    const t=spT(Object.assign({type:'track'},cur));
    if(t&&(Q.length!==1||Q[0].id!==t.id)){Q=[t];qi=0;spCurId=cur.id;show(t)}
  }
  if(cur&&cur.id===spCurId&&!s.paused&&s.position>0)spHeard=true;
  playing=!s.paused;sync();

    try{await go()}catch(e){
      if(e.status!==404)throw e;
      await spApi('/me/player',{method:'PUT',body:{device_ids:[dev],play:false}});
      await new Promise(r=>setTimeout(r,700));await go();

/* «Радио»: когда очередь кончилась, добавляем песни тех же исполнителей, которых ты только что слушал */
async function extendQueue(){
  const names=[...new Set(Q.slice(-12).map(t=>(t.artist||'').split(', ')[0]).filter(Boolean))].slice(-4);
  if(!names.length)return false;
  const have=new Set(Q.map(t=>t.id)),add=[];
  const rs=await Promise.allSettled(names.map(n=>spTracks('artist:"'+n+'"',20)));
  rs.forEach((r,k)=>{if(r.status==='fulfilled')r.value.filter(t=>!have.has(t.id)&&t.artist.toLowerCase().includes(names[k].toLowerCase())).slice(0,6).forEach(t=>{have.add(t.id);add.push(t)})});
  for(let i=add.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[add[i],add[j]]=[add[j],add[i]]}
  if(!add.length)return false;
  Q.push(...add);return true;
}

function paintHearts(){
  document.querySelectorAll('[data-id]').forEach(r=>{const b=r.querySelector('.hb');if(b)b.classList.toggle('on',likeMap.get(r.dataset.id)===true)});
  const t=Q[qi];if(t)$('#heart').classList.toggle('on',isFav(t));
}
async function syncLikes(list){
  const need=list.filter(t=>t&&t.sp&&!likeMap.has(t.id)).map(t=>t.uri).slice(0,80);
  for(let i=0;i<need.length;i+=40){
    const part=need.slice(i,i+40);
    try{const r=await spApi('/me/library/contains?uris='+enc(part.join(',')));part.forEach((u,j)=>likeMap.set('sp'+u.split(':')[2],!!(r&&r[j])))}catch(e){}
  }
  paintHearts();
}
async function toggleFav(t){
  const was=isFav(t);likeMap.set(t.id,!was);paintHearts();
  try{await spApi('/me/library?uris='+enc(t.uri),{method:was?'DELETE':'PUT'});toast(was?'Убрано из любимых':'Добавлено в любимые')}
  catch(e){likeMap.set(t.id,was);paintHearts();toast('Не получилось. Войди в Spotify заново в Настройках')}
}
$('#heart').innerHTML=HEART;
$('#heart').onclick=()=>{const t=Q[qi];if(t)toggleFav(t)};

/* ---------- views ---------- */
const body=$('#body');let tab='home',sub=null,homeTracks=[];
function rows(list,ctx){
  const f=document.createElement('div');
  list.forEach((t,i)=>{const r=document.createElement('div');r.className='row';r.dataset.id=t.id;
    r.innerHTML=`<div class="th" style="background-image:url('${url(t.art)}')"></div><div class="m"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button class="ib hb ${isFav(t)?'on':''}" aria-label="В любимые">${HEART}</button><span class="d">${t.dur?fmt(t.dur):''}</span>`;
    r.onclick=()=>playList(list,i,ctx);
    r.querySelector('.hb').onclick=e=>{e.stopPropagation();toggleFav(t)};
    f.appendChild(r)});
  syncLikes(list);markCur();
  return f;
}
const msg=t=>`<div class="empty">${t}</div>`;
const msgEl=t=>{const d=document.createElement('div');d.className='empty';d.innerHTML=t;return d};
function setTab(t){tab=t;sub=null;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({home,search,lib,set:settings})[t]();body.scrollTop=0}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
async function loadHome(){homeTracks=spTs(((await spApi('/me/tracks?limit=50')).items||[]).map(x=>x.track))}
const home=homeSp,search=searchSp;
function secEl(title,withPlay,opts){
  const s=document.createElement('section'),h=document.createElement('div');h.className='h';
  h.innerHTML='<span>'+esc(title)+'</span>';
  let btn=null;
  if(withPlay){btn=document.createElement('button');btn.className='pill';btn.textContent='Слушать всё';btn.style.visibility='hidden';h.appendChild(btn)}
  const box=document.createElement('div');box.className='sec';box.innerHTML=msg('Загрузка…');
  s.appendChild(h);s.appendChild(box);return Object.assign({s,box,btn},opts||{});
}
async function runSec(sec,loader,render){
  const none=()=>{if(sec.hide)sec.s.remove();else sec.box.innerHTML=msg(sec.empty||'Пока пусто.')};
  try{
    const data=await loader();sec.box.innerHTML='';
    if(!data||!data.length){none();return}
    render(data);
  }catch(e){sec.failed=e;sec.box.innerHTML=msg('Не загрузилось'+(e&&e.status?' (код '+e.status+')':'')+'.')}
}
let sT;
function openList(title,list,o={}){
  sub=o;body.innerHTML=`<div class="h"><button class="pill g" id="bk">← Назад</button><span style="flex:1;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</span><button class="pill" id="pa">Слушать</button></div>`;
  $('#bk').onclick=()=>setTab(tab);$('#pa').onclick=()=>list.length&&playList(list,0,o.ctx);
  if(!list.length)body.insertAdjacentHTML('beforeend',msg('Здесь пока пусто.'));
  else body.appendChild(rows(list,o.ctx));
}
async function lib(){
  sub=null;
  body.innerHTML='<div class="gr">Моя медиатека</div><div class="chips" id="lc"></div><div id="ll"></div>';
  const ll=$('#ll'),lc=$('#lc');
  let kind=jget('libkind','pl');
  const kinds=[['Плейлисты','pl'],['Исполнители','ar'],['Альбомы','al']];
  const row=(img,bg,title,subt,fn,round)=>{const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="th" style="${img?`background-image:url('${url(img)}')`:'background:'+bg}${round?';border-radius:50%':''}">${img?'':'♥'}</div><div class="m"><b>${esc(title)}</b><span>${esc(subt)}</span></div>`;r.onclick=fn;ll.appendChild(r)};
  const paintC=()=>{lc.innerHTML='';kinds.forEach(([n,k])=>{const b=document.createElement('button');b.className='chip'+(k===kind?' on':'');b.textContent=n;b.onclick=()=>{kind=k;jset('libkind',k);paintC();load()};lc.appendChild(b)})};
  const load=async()=>{
    ll.innerHTML='';
    if(!spTok()){ll.innerHTML=msg('Spotify не подключён — зайди в Настройки.');return}
    ll.innerHTML=msg('Загрузка…');
    try{
      if(kind==='pl'){
        const a=await myPlaylists();if(tab!=='lib'||sub)return;ll.innerHTML='';
        row('','linear-gradient(135deg,#450af5,#c4efd9)','Любимые треки','Плейлист · Spotify',openSpLiked);
        a.forEach(p=>row(spImg(p.images,1),'',p.name,'Плейлист · '+((p.owner&&p.owner.display_name)||''),()=>openSpPlaylist(p)));
      }else if(kind==='ar'){
        const d=await spApi('/me/following?type=artist&limit=40');if(tab!=='lib'||sub)return;ll.innerHTML='';
        const a=clean(d.artists&&d.artists.items);
        if(!a.length)ll.innerHTML=msg('Ты пока ни на кого не подписан.');
        a.forEach(x=>row(spImg(x.images,1),'',x.name,'Исполнитель',()=>openSpArtist(x),true));
      }else{
        const d=await spApi('/me/albums?limit=40');if(tab!=='lib'||sub)return;ll.innerHTML='';
        const a=clean((d.items||[]).map(x=>x.album));
        if(!a.length)ll.innerHTML=msg('Сохранённых альбомов пока нет.');
        a.forEach(x=>row(spImg(x.images,1),'',x.name,'Альбом · '+(x.artists||[]).map(y=>y.name).join(', '),()=>openSpAlbum(x)));
      }
    }catch(e){ll.innerHTML=msg(e.status===403?'Нужен повторный вход: Настройки → «Войти заново».':'Не загрузилось.')}
  };
  paintC();load();
}
function settings(){
  const vol=Math.round(jget('vol',.8)*100);
  body.innerHTML=`<div class="set"><label>Spotify <span>${spTok()?'✓ подключён':'не подключён'}</span></label>
  <input type="text" id="spc" placeholder="Client ID из developer.spotify.com" value="${esc(spCid())}" autocomplete="off">
  <div class="rw"><button class="pill" id="spl">${spTok()?'Войти заново':'Войти через Spotify'}</button>${spTok()?'<button class="pill g" id="splo">Выйти</button>':''}</div>
  <p>Redirect URI для приложения Spotify (скопируй точно): <b style="color:#fff;word-break:break-all">${esc(spRedirect())}</b></p>
  ${spProblem()?'<div class="note" style="margin-top:10px"><b>Важно:</b> '+esc(spProblem())+'</div>':''}
  <label>Громкость <span id="vv">${vol}%</span></label><input type="range" id="vol" min="0" max="100" value="${vol}">
  <label>Картинка головы</label><div class="rw"><button class="pill g" id="up">Загрузить свою</button><button class="pill g" id="rs">Вернуть стандартную</button></div>
  ${APP?'<label>Приложение</label><div class="rw"><button class="pill g" id="quit">Закрыть плеер</button></div>':''}
  <p>Музыка идёт только из Spotify, нужен Premium (студенческий подходит). Подборки Spotify (Top 50, Daily Mix) запускаются целиком, но список треков внутри них Spotify приложениям не показывает. Сердечко добавляет трек в «Любимые» в твоём Spotify.</p><p style="opacity:.55">Сборка: 17.11, v3 (сердечко + лента)</p></div>`;
  if($('#quit'))$('#quit').onclick=()=>inv('quit');
  $('#spc').onchange=e=>jset('sp_cid',e.target.value.trim());
  $('#spl').onclick=()=>{jset('sp_cid',$('#spc').value.trim());spLogin()};
  if($('#splo'))$('#splo').onclick=()=>{localStorage.removeItem('sp_tok');try{spPlayer&&spPlayer.disconnect()}catch(_){}spPlayer=null;spReady=null;spDev='';spSt=null;playing=false;sync();toast('Вышел из Spotify');settings()};
  const rg=(el,f)=>{const u=()=>{el.style.setProperty('--p',el.value/el.max*100+'%')};u();el.oninput=()=>{u();f(el.value)}};
  rg($('#vol'),v=>{if(spPlayer)spPlayer.setVolume(v/100);$('#vv').textContent=v+'%';jset('vol',v/100)});
  $('#up').onclick=()=>$('#hf').click();$('#rs').onclick=()=>{localStorage.removeItem('chibi_head');setHead(DEF_HEAD)};
}
$('#hf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{setHead(r.result);try{localStorage.setItem('chibi_head',r.result)}catch(_){}};r.readAsDataURL(f)};


/* ---------- fixed position + drag with mouse ---------- */
const wid=$('#wid'),panel=$('#panel');
const clampX=v=>Math.min(Math.max(v,0),Math.max(0,innerWidth-SIZE));
const clampY=v=>Math.min(Math.max(v,0),Math.max(0,innerHeight-SIZE));
let x=clampX(jget('posx',Math.random()*Math.max(1,innerWidth-SIZE)));
let y=clampY(jget('posy',Math.random()*Math.max(1,innerHeight-SIZE)));
let hover=false,leaveT;
let hdrag=false,hmoved=false,ox=0,oy=0;

$('#head').addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  hdrag=true;hmoved=false;ox=e.clientX-x;oy=e.clientY-y;
  wid.classList.add('dragging');report();
  try{$('#head').setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
addEventListener('pointermove',e=>{
  if(!hdrag)return;
  const nx=clampX(e.clientX-ox),ny=clampY(e.clientY-oy);
  if(!hmoved&&Math.hypot(nx-x,ny-y)>3)hmoved=true;
  x=nx;y=ny;
  if(wid.classList.contains('open'))place();
  kick();
});
addEventListener('pointerup',e=>{
  if(!hdrag)return;
  hdrag=false;wid.classList.remove('dragging');
  try{$('#head').releasePointerCapture(e.pointerId)}catch(_){}
  jset('posx',Math.round(x));jset('posy',Math.round(y));report();kick();
});

/* Цикл отрисовки работает только когда он нужен: перетаскивание или открытая панель во время игры */
let rafOn=false;
function kick(){if(!rafOn){rafOn=true;requestAnimationFrame(frame)}}
function frame(){
  rafOn=false;
  wid.style.transform=`translate3d(${x}px,${y}px,0)`;
  const open=wid.classList.contains('open');
  if(open){
    const du=curDur(),ct=curPos();
    if(!drag){seek.value=du?ct/du*1000:0;paint();$('#tcur').textContent=fmt(ct*1000)}
    $('#tdur').textContent=du&&isFinite(du)?fmt(du*1000):(Q[qi]&&Q[qi].dur?fmt(Q[qi].dur):'0:00');
  }
  if(hdrag||(open&&playing)){rafOn=true;requestAnimationFrame(frame)}
}
addEventListener('resize',()=>{x=clampX(x);y=clampY(y);if(wid.classList.contains('open'))place();kick();report()});

/* ---------- области, которые ловят мышь (в приложении остальное окно «прозрачно» для кликов) ---------- */
let lastRects='';
function report(){
  if(!APP)return;
  const d=window.devicePixelRatio||1,pad=14;
  const head=[(x-pad)*d,(y-pad)*d,(SIZE+pad*2)*d,(SIZE+pad*2)*d];
  let any=[head];
  if(hdrag)any=[[0,0,1e5,1e5]];
  else if(wid.classList.contains('open'))any.push([(x+panel.offsetLeft)*d,(y+panel.offsetTop)*d,panel.offsetWidth*d,panel.offsetHeight*d]);
  const key=JSON.stringify([head,any]);
  if(key===lastRects)return;
  lastRects=key;
  inv('set_rects',{head:[head],any}).catch(()=>{});
}
if(APP){
  window.__TAURI__.event.listen('hover',e=>{
    const p=String(e.payload).split(',');
    if(p[1]==='1')clearTimeout(leaveT);
    if(p[0]==='1'&&!wid.classList.contains('open'))openP();
    if(p[1]==='0'&&!hdrag)closeP();
  });
  window.__TAURI__.event.listen('sp-callback',e=>{
    const q=new URLSearchParams(String(e.payload));spFinish(q.get('code'),q.get('error'));
  });
}

/* ---------- hover morph ---------- */
function place(){
  const pw=panel.offsetWidth,ph=panel.offsetHeight;
  const roomR=innerWidth-8-(x+SIZE-6),roomL=x-8;
  const right=roomR>=pw?true:(roomL>=pw?false:roomR>=roomL);
  let left=right?SIZE-6:-pw+6;
  let top=-(ph-SIZE)/2;
  left=Math.min(Math.max(x+left,8),Math.max(8,innerWidth-pw-8))-x;
  top=Math.min(Math.max(y+top,8),Math.max(8,innerHeight-ph-8))-y;
  panel.style.left=left+'px';panel.style.top=top+'px';
  panel.style.transformOrigin=(right?'0%':'100%')+' '+(SIZE/2-top)+'px';
  report();
}
let booted=false;
function ensureBoot(){if(booted)return;booted=true;setTab('home')}
function openP(){clearTimeout(leaveT);hover=true;ensureBoot();place();wid.classList.add('open');kick();report()}
function closeP(){clearTimeout(leaveT);leaveT=setTimeout(()=>{hover=false;wid.classList.remove('open');report()},240)}
wid.addEventListener('mouseenter',openP);wid.addEventListener('mouseleave',closeP);
$('#head').addEventListener('click',()=>{if(hmoved){hmoved=false;return}if(matchMedia('(hover:none)').matches&&!wid.classList.contains('open'))openP();else toggle()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();toggle()}});

/* ---------- boot ---------- */
async function spFinish(code,er){
  if(er||!code){toast('Вход в Spotify отменён');return}
  try{
    await spToken({grant_type:'authorization_code',code,redirect_uri:spRedirect(),code_verifier:jget('sp_ver','')});
    toast('Spotify подключён!');booted=false;openP();
  }catch(e){toast('Не удалось войти в Spotify — проверь Client ID и Redirect URI')}
}
(()=>{
  const p=new URLSearchParams(location.search),code=p.get('code'),er=p.get('error');
  if(code||er){history.replaceState(null,'',location.pathname);spFinish(code,er)}
})();
sync();kick();report();
</script>
</body>
