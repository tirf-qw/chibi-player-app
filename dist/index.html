<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chibi Player</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#wid{position:fixed;left:0;top:0;width:124px;height:124px;will-change:transform}
#head{position:absolute;inset:0;display:grid;place-items:center;cursor:grab;touch-action:none}
#wid.dragging #head{cursor:grabbing}
#headImg{width:118px;height:118px;object-fit:contain;pointer-events:none;user-select:none;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.6));animation:spin 6s linear infinite;animation-play-state:paused}
#wid.playing #headImg{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#menu{position:fixed;display:none;background:#282828;border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.6);
  font:600 13px "Segoe UI",system-ui,sans-serif;color:#fff;min-width:190px;z-index:5}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:9px 12px;border-radius:6px;cursor:pointer}
#menu button:hover{background:#3a3a3a}
@media (prefers-reduced-motion:reduce){#headImg{animation-duration:14s}}
</style>
</head>
<body>
<div id="wid"><div id="head"><img id="headImg" alt=""></div></div>
<div id="menu">
  <button id="mHead">Сменить картинку головы</button>
  <button id="mReset">Стандартная картинка</button>
  <button id="mQuit">Закрыть плеер</button>
</div>
<input type="file" id="hf" accept="image/*" hidden>
<script>
const DEFAULT_HEAD='__HEAD__';
const $=s=>document.querySelector(s),SIZE=124,PAD=14;
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(_){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
const inv=(c,a)=>window.__TAURI_INTERNALS__?window.__TAURI_INTERNALS__.invoke(c,a):Promise.resolve();
const FALLBACK_HEAD='data:image/svg+xml;utf8,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><circle cx='60' cy='62' r='44' fill='#ffd9b8'/><path d='M14 62a46 46 0 0 1 92 0' fill='none' stroke='#1ed760' stroke-width='9'/><rect x='6' y='56' width='16' height='30' rx='8' fill='#1ed760'/><rect x='98' y='56' width='16' height='30' rx='8' fill='#1ed760'/><circle cx='45' cy='64' r='5' fill='#222'/><circle cx='75' cy='64' r='5' fill='#222'/><path d='M48 82q12 10 24 0' fill='none' stroke='#222' stroke-width='4' stroke-linecap='round'/></svg>");
const DEF_HEAD=DEFAULT_HEAD.indexOf('__HEAD__')===0?FALLBACK_HEAD:DEFAULT_HEAD;
const setHead=src=>{$('#headImg').src=src};
setHead(localStorage.getItem('chibi_head')||DEF_HEAD);

const wid=$('#wid'),menu=$('#menu');
const clampX=v=>Math.min(Math.max(v,0),Math.max(0,innerWidth-SIZE));
const clampY=v=>Math.min(Math.max(v,0),Math.max(0,innerHeight-SIZE));
let x=clampX(jget('posx',Math.random()*Math.max(1,innerWidth-SIZE)));
let y=clampY(jget('posy',Math.random()*Math.max(1,innerHeight-SIZE)));
let dragging=false,moved=false,ox=0,oy=0,menuT;
const apply=()=>{wid.style.transform=`translate3d(${x}px,${y}px,0)`};

/* области, которые ловят мышь; остальное окно пропускает клики к тому, что под ним */
let lastKey='';
function report(){
  const d=window.devicePixelRatio||1;
  const head=[x*d,y*d,SIZE*d,SIZE*d];
  let any=[[(x-PAD)*d,(y-PAD)*d,(SIZE+PAD*2)*d,(SIZE+PAD*2)*d]];
  if(dragging)any=[[0,0,1e5,1e5]];
  else if(menu.style.display==='block')any.push([menu.offsetLeft*d,menu.offsetTop*d,menu.offsetWidth*d,menu.offsetHeight*d]);
  const key=JSON.stringify([head,any]);
  if(key===lastKey)return;lastKey=key;
  inv('set_rects',{head:[head],any}).catch(()=>{});
}
function hideMenu(){clearTimeout(menuT);menu.style.display='none';report()}
function showMenu(){
  menu.style.display='block';
  const w=menu.offsetWidth,h=menu.offsetHeight;
  menu.style.left=Math.min(Math.max(x,8),Math.max(8,innerWidth-w-8))+'px';
  menu.style.top=(y+SIZE+4+h>innerHeight?Math.max(8,y-h-4):y+SIZE+4)+'px';
  report();clearTimeout(menuT);menuT=setTimeout(hideMenu,7000);
}

$('#head').addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  hideMenu();
  dragging=true;moved=false;ox=e.clientX-x;oy=e.clientY-y;
  wid.classList.add('dragging');inv('set_drag',{on:true});report();
  try{$('#head').setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  const nx=clampX(e.clientX-ox),ny=clampY(e.clientY-oy);
  if(!moved&&Math.hypot(nx-x,ny-y)>3)moved=true;
  x=nx;y=ny;apply();
});
addEventListener('pointerup',e=>{
  if(!dragging)return;
  dragging=false;wid.classList.remove('dragging');
  try{$('#head').releasePointerCapture(e.pointerId)}catch(_){}
  jset('posx',Math.round(x));jset('posy',Math.round(y));
  inv('set_drag',{on:false});report();
  if(!moved)inv('toggle_play');                 // клик по голове = пауза / продолжить
});
$('#head').addEventListener('contextmenu',e=>{e.preventDefault();showMenu()});
$('#mHead').onclick=()=>{hideMenu();$('#hf').click()};
$('#mReset').onclick=()=>{localStorage.removeItem('chibi_head');setHead(DEF_HEAD);hideMenu()};
$('#mQuit').onclick=()=>inv('quit');
$('#hf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{setHead(r.result);try{localStorage.setItem('chibi_head',r.result)}catch(_){}};r.readAsDataURL(f)};
addEventListener('keydown',e=>{if(e.key==='Escape')hideMenu()});
addEventListener('resize',()=>{x=clampX(x);y=clampY(y);apply();report()});
if(window.__TAURI__&&window.__TAURI__.event)window.__TAURI__.event.listen('sp-playing',e=>wid.classList.toggle('playing',!!e.payload));
apply();report();
</script>
</body>
</html>
